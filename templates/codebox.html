{{ block "CodeBox" . }}

<!-- Monaco Editor Scripts -->
<link rel="stylesheet" data-name="vs/editor/editor.main" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.53.0/min/vs/editor/editor.main.min.css">
<script>
    var require = { paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.53.0/min/vs' } };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.53.0/min/vs/loader.min.js"></script>

<div class="flex flex-col h-full">
    <!-- Code Editor Section -->
    <div class="flex-1 overflow-hidden relative">
        <div id="codebox" class="w-full h-full p-0 firacode-400 dark:bg-gray-900"></div>
    </div>

    <!-- Toggle bar for I/O panel -->
    <div class="shrink-0 px-2 py-1 dark:bg-gray-800 bg-gray-100 border-t dark:border-gray-700 border-gray-200 flex items-center justify-between">
        <div class="text-[11px] uppercase tracking-wide text-gray-600 dark:text-gray-300">Testcases / Output</div>
        <button id="io-toggle-btn" type="button"
            class="text-xs px-2 py-1 rounded-md bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600">
            Show
        </button>
    </div>

    <!-- Testcases and Output Section -->
    <div id="io-panel" class="hidden flex flex-col md:flex-row gap-4 p-2 dark:bg-gray-800 bg-gray-100 h-1/3 shrink-0">
        <div class="flex flex-col flex-1 h-full gap-1">
            <div class="text-[10px] text-gray-500 uppercase font-bold ml-1">Input (Stdin)</div>
            <textarea id="testcases"
                class="border dark:border-gray-600 rounded-lg w-full p-2 dark:text-white bg-white dark:bg-gray-700 resize-none font-mono text-xs flex-1 shadow-inner"
                placeholder="Enter your testcases (stdin)" rows="5"></textarea>
        </div>
        <div class="flex flex-col flex-1 h-full gap-1">
            <div class="text-[10px] text-gray-500 uppercase font-bold ml-1">Terminal Output</div>
            <textarea id="output"
                class="terminal-textarea border-none rounded-lg w-full p-2 text-green-400 bg-black resize-none font-mono text-xs flex-1 shadow-lg"
                placeholder="Output will be shown here..." rows="5" readonly></textarea>
        </div>
    </div>
</div>

<style>
    #codebox {
        height: 100%;
        width: 100%;
        min-height: 200px;
    }
</style>

<script src="/static/javascript/webrtc.js"></script>
<script src="/static/javascript/websocketClient.js"></script>

{{ end }}
